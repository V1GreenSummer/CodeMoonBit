name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project requires moonc >= 0.10.14; the stable channel is older,
      # so CI installs the development channel.
      - name: Install MoonBit (dev channel)
        run: |
          export MOONBIT_INSTALL_DEV=1
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          moon version --all
          version=$(moon version --all | sed -n 's/.*moonc v\([0-9][0-9.]*\).*/\1/p' | head -1)
          echo "moonc=$version"
          test -n "$version"
          lowest=$(printf '%s\n0.10.14\n' "$version" | sort -V | head -1)
          if [ "$lowest" != "0.10.14" ]; then
            echo "moonc $version is older than the required 0.10.14"
            exit 1
          fi

      # The development channel advances continuously and the MoonBit
      # formatter and .mbti generator are version sensitive, so these two
      # steps report drift instead of failing the build. Run `moon fmt` and
      # `moon info` with the same dev build locally before pushing.
      - name: Format check (advisory)
        run: moon fmt --check || echo "::warning title=MoonBit format drift::moon fmt differs with this toolchain version"

      - name: Interface check (advisory)
        run: |
          moon info
          git diff --exit-code || echo "::warning title=MoonBit interface drift::moon info changed the generated interfaces with this toolchain version"

      - name: Type check
        run: moon check --target wasm-gc

      - name: Unit tests
        run: moon test --target wasm-gc

      - name: Build wasm
        run: moon build --target wasm-gc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node DOM-shim integration tests
        run: node js/e2e.mjs

      - name: Real browser integration tests
        run: node js/browser_e2e.mjs
