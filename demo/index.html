<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeMoonBit Demo</title>
    <link rel="stylesheet" href="../js/codemoonbit.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>CodeMoonBit</h1>
      <div class="controls">
        <label>
          Language
          <select id="language" title="Syntax highlighting language">
            <optgroup label="MoonBit / data">
              <option value="moonbit" selected>MoonBit</option>
              <option value="plain">Plain text</option>
              <option value="json">JSON</option>
              <option value="markdown">Markdown</option>
              <option value="diff">Diff</option>
            </optgroup>
            <optgroup label="Systems">
              <option value="c">C</option>
              <option value="cpp">C++</option>
              <option value="rust">Rust</option>
              <option value="go">Go</option>
              <option value="swift">Swift</option>
              <option value="kotlin">Kotlin</option>
              <option value="java">Java</option>
              <option value="csharp">C#</option>
              <option value="dart">Dart</option>
              <option value="scala">Scala</option>
              <option value="groovy">Groovy</option>
              <option value="solidity">Solidity</option>
              <option value="protobuf">Protobuf</option>
              <option value="graphql">GraphQL</option>
              <option value="hcl">HCL / Terraform</option>
              <option value="nix">Nix</option>
            </optgroup>
            <optgroup label="Web">
              <option value="javascript">JavaScript</option>
              <option value="typescript">TypeScript</option>
              <option value="html">HTML</option>
              <option value="xml">XML</option>
              <option value="vue">Vue</option>
              <option value="css">CSS</option>
              <option value="scss">SCSS</option>
              <option value="less">Less</option>
              <option value="php">PHP</option>
            </optgroup>
            <optgroup label="Scripting">
              <option value="python">Python</option>
              <option value="ruby">Ruby</option>
              <option value="perl">Perl</option>
              <option value="lua">Lua</option>
              <option value="r">R</option>
              <option value="julia">Julia</option>
              <option value="elixir">Elixir</option>
              <option value="erlang">Erlang</option>
              <option value="haskell">Haskell</option>
              <option value="ocaml">OCaml</option>
              <option value="clojure">Clojure</option>
              <option value="lisp">Lisp / Scheme</option>
              <option value="shell">Shell</option>
              <option value="powershell">PowerShell</option>
            </optgroup>
            <optgroup label="Data &amp; build">
              <option value="sql">SQL</option>
              <option value="yaml">YAML</option>
              <option value="toml">TOML</option>
              <option value="ini">INI</option>
              <option value="latex">LaTeX</option>
              <option value="makefile">Makefile</option>
              <option value="dockerfile">Dockerfile</option>
            </optgroup>
          </select>
        </label>
        <label>
          Theme
          <select id="theme" title="Editor theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="line-numbers" checked /> Line numbers</label>
        <label class="check"><input type="checkbox" id="line-wrapping" /> Wrap lines</label>
        <label class="check"><input type="checkbox" id="read-only" /> Read-only</label>
        <button id="search" title="Search (Ctrl/&#8984;-F)">Search</button>
        <button id="undo" title="Undo (Ctrl/&#8984;-Z)">Undo</button>
        <button id="redo" title="Redo (Ctrl/&#8984;-Y)">Redo</button>
        <button id="fold-all" title="Fold all foldable blocks">Fold all</button>
        <button id="unfold-all" title="Unfold all blocks">Unfold all</button>
      </div>
    </header>
    <main>
      <div id="editor" aria-label="Code editor"></div>
      <p class="shortcuts">
        Ctrl/&#8984;-F search &middot; Alt-&#8593;/&#8595; multi-cursor &middot;
        Ctrl/&#8984;-/ comment &middot; Tab indent
      </p>
    </main>
    <footer id="status" role="status">Loading editor&hellip;</footer>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
